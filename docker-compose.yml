services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: investment
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
    ports:
      - "5433:5432"
    volumes:
      - investment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  investment_postgres:
