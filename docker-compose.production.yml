name: formacao-do-investidor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment}
      POSTGRES_USER: ${POSTGRES_USER:-investment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.production}
    volumes:
      - investment_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    command: ["/app/deployment/start-api.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-investment_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-investment}
      APP_ENVIRONMENT: production
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-formacaodoinvestidor.com.br,www.formacaodoinvestidor.com.br,app,api,localhost,127.0.0.1}
      APP_AUTH_REQUIRED: ${APP_AUTH_REQUIRED:-true}
      APP_OWNER_EMAILS: ${APP_OWNER_EMAILS:?Defina APP_OWNER_EMAILS em .env.production}
      APP_SECRETS_FILE: /app/secrets/app_secrets.toml
      CANONICAL_URL: https://${DOMAIN:-formacaodoinvestidor.com.br}
      SECURE_COOKIES: "true"
      DATA_STALE_HOURS_MARKET: ${DATA_STALE_HOURS_MARKET:-6}
      DATA_STALE_HOURS_FUNDAMENTALS: ${DATA_STALE_HOURS_FUNDAMENTALS:-72}
      GORDON_REQUIRED_RETURN_PCT: ${GORDON_REQUIRED_RETURN_PCT:-12.0}
      GORDON_GROWTH_PCT: ${GORDON_GROWTH_PCT:-4.0}
      VALUATION_MARGIN_OF_SAFETY_PCT: ${VALUATION_MARGIN_OF_SAFETY_PCT:-20.0}
      BACKTEST_CALLBACK_TOKEN: ${BACKTEST_CALLBACK_TOKEN:?Defina BACKTEST_CALLBACK_TOKEN em .env.production}
      ALERT_MONITOR_ENABLED: ${ALERT_MONITOR_ENABLED:-true}
      ALERT_MONITOR_POLL_SECONDS: ${ALERT_MONITOR_POLL_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Formação do Investidor}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - ./deployment/secrets/app_secrets.toml:/app/secrets/app_secrets.toml:ro
    expose:
      - "8000"
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-formacaodoinvestidor.com.br}
      ACME_EMAIL: ${ACME_EMAIL:-contato@formacaodoinvestidor.com.br}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy

volumes:
  investment_postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend:
