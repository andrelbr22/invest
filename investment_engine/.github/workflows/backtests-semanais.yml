name: Backtests oficiais semanais
run-name: Backtests oficiais • ${{ inputs.job_id || 'agendado' }}

on:
  schedule:
    # 00:01 de sábado em Brasília (03:01 UTC).
    - cron: "1 3 * * 6"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Até 100 tickers separados por vírgula; vazio usa as 50 ações do filtro Padrão"
        required: false
        default: ""
      max_combinations:
        description: "Combinações por ativo (máximo 200)"
        required: true
        default: "200"
      job_id:
        description: "Identificador do pedido registrado no painel"
        required: false
        default: ""

concurrency:
  group: backtests-oficiais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar conexão PostgreSQL
        run: python -m scripts.run_weekly_backtests --validate-database-only
      - name: Atualização agendada
        if: github.event_name == 'schedule'
        run: python -m scripts.run_weekly_backtests --source scheduled --max-combinations 200
      - name: Atualização manual do proprietário
        if: github.event_name == 'workflow_dispatch'
        env:
          MANUAL_TICKERS: ${{ inputs.tickers }}
          MANUAL_MAX_COMBINATIONS: ${{ inputs.max_combinations }}
          MANUAL_JOB_ID: ${{ inputs.job_id }}
        run: |
          args=(--source manual --max-combinations "$MANUAL_MAX_COMBINATIONS" --tickers "$MANUAL_TICKERS")
          if [ -n "$MANUAL_JOB_ID" ]; then
            args+=(--job-id "$MANUAL_JOB_ID")
          fi
          python -m scripts.run_weekly_backtests "${args[@]}"
