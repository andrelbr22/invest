name: formacao-do-investidor-oracle

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.oracle
    environment:
      POSTGRES_USER: investment
      POSTGRES_DB: investment_engine
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    shm_size: 64mb
    mem_limit: 220m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment_engine"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: formacao-do-investidor-production:current
    restart: unless-stopped
    command: ["/app/deployment/start-api.sh"]
    environment:
      APP_ENVIRONMENT: production
      APP_AUTH_REQUIRED: "true"
      APP_SECRETS_FILE: /app/secrets/app_secrets.toml
      ALLOWED_HOSTS: formacaodoinvestidor.com.br,www.formacaodoinvestidor.com.br,app,api,localhost,127.0.0.1
      CANONICAL_URL: https://formacaodoinvestidor.com.br
      SECURE_COOKIES: "true"
      API_DOCS_ENABLED: "false"
      ALERT_MONITOR_ENABLED: "false"
      ALERT_MONITOR_POLL_SECONDS: "60"
    volumes:
      - ./deployment/secrets/app_secrets.toml:/app/secrets/app_secrets.toml:ro
    expose:
      - "8000"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  staging:
    build:
      context: .
    image: formacao-do-investidor-staging:candidate
    restart: unless-stopped
    command: ["/app/deployment/start-api.sh"]
    environment:
      APP_ENVIRONMENT: staging
      APP_AUTH_REQUIRED: "true"
      APP_SECRETS_FILE: /app/secrets/app_secrets.toml
      ALLOWED_HOSTS: formacaodoinvestidor.com.br,www.formacaodoinvestidor.com.br,staging,localhost,127.0.0.1
      CANONICAL_URL: https://formacaodoinvestidor.com.br/testefdi/
      SECURE_COOKIES: "true"
      API_DOCS_ENABLED: "false"
      ALERT_MONITOR_ENABLED: "false"
      IN_PROCESS_BACKGROUND_WORKER_ENABLED: "true"
      BACKGROUND_SCHEDULER_ENABLED: "false"
      DATABASE_NAME_OVERRIDE: investment_engine_staging
    volumes:
      - ./deployment/secrets/app_secrets.toml:/app/secrets/app_secrets.toml:ro
    expose:
      - "8000"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  worker:
    image: formacao-do-investidor-production:current
    restart: unless-stopped
    command: ["/app/deployment/start-worker.sh"]
    environment:
      APP_ENVIRONMENT: production
      APP_SECRETS_FILE: /app/secrets/app_secrets.toml
      BACKGROUND_WORKER_POLL_SECONDS: "2"
      BACKGROUND_SCHEDULER_ENABLED: "true"
      BACKGROUND_SCHEDULER_TICK_SECONDS: "60"
      ALERT_MONITOR_ENABLED: "true"
      DATABASE_POOL_SIZE: "1"
      DATABASE_MAX_OVERFLOW: "0"
    volumes:
      - ./deployment/secrets/app_secrets.toml:/app/secrets/app_secrets.toml:ro
    networks:
      # A rede frontend fornece DNS e saída HTTPS para as fontes externas.
      # A backend permanece necessária para o PostgreSQL isolado.
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 260m
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from investment_engine.infrastructure.db.session import get_session_factory; s=get_session_factory()(); s.execute(text('SELECT 1')); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: formacaodoinvestidor.com.br
      ACME_EMAIL: contato@formacaodoinvestidor.com.br
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile.oracle-micro.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
