name: formacao-do-investidor-oracle

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.oracle
    environment:
      POSTGRES_USER: investment
      POSTGRES_DB: investment_engine
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    shm_size: 64mb
    mem_limit: 220m
    cpu_shares: 1024
    pids_limit: 80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment_engine"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: formacao-do-investidor-production:current
    restart: unless-stopped
    command: ["/app/deployment/start-api.sh"]
    environment:
      APP_ENVIRONMENT: production
      APP_AUTH_REQUIRED: "true"
      APP_SECRETS_FILE: /app/secrets/app_secrets.toml
      ALLOWED_HOSTS: formacaodoinvestidor.com.br,www.formacaodoinvestidor.com.br,app,api,localhost,127.0.0.1
      CANONICAL_URL: https://formacaodoinvestidor.com.br
      SECURE_COOKIES: "true"
      API_DOCS_ENABLED: "false"
      ALERT_MONITOR_ENABLED: "false"
      ALERT_MONITOR_POLL_SECONDS: "60"
      DATABASE_POOL_SIZE: "4"
      DATABASE_MAX_OVERFLOW: "1"
      DATABASE_POOL_TIMEOUT_SECONDS: "10"
      SERVICE_NODE_ID: primary-web
      APP_COMMIT_SHA: "${FDI_RELEASE_COMMIT:-unknown}"
    volumes:
      - ./deployment/secrets/app_secrets.toml:/app/secrets/app_secrets.toml:ro
    expose:
      - "8000"
    # Em uma VM de 1 GB, a navegação e o banco devem vencer a disputa por CPU.
    # cpu_shares só atua quando existe contenção; não reduz a capacidade ociosa.
    cpu_shares: 1024
    mem_limit: 340m
    pids_limit: 100
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  staging:
    build:
      context: .
    image: formacao-do-investidor-staging:candidate
    restart: unless-stopped
    command: ["/app/deployment/start-api.sh"]
    environment:
      APP_ENVIRONMENT: staging
      APP_AUTH_REQUIRED: "true"
      APP_SECRETS_FILE: /app/secrets/app_secrets.toml
      ALLOWED_HOSTS: formacaodoinvestidor.com.br,www.formacaodoinvestidor.com.br,staging,localhost,127.0.0.1
      CANONICAL_URL: https://formacaodoinvestidor.com.br/testefdi/
      SECURE_COOKIES: "true"
      API_DOCS_ENABLED: "false"
      ALERT_MONITOR_ENABLED: "false"
      IN_PROCESS_BACKGROUND_WORKER_ENABLED: "true"
      BACKGROUND_WORKER_POLL_SECONDS: "10"
      BACKGROUND_SCHEDULER_ENABLED: "false"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "0"
      DATABASE_POOL_TIMEOUT_SECONDS: "10"
      DATABASE_NAME_OVERRIDE: investment_engine_staging
      SERVICE_NODE_ID: primary-staging
      APP_COMMIT_SHA: "${FDI_RELEASE_COMMIT:-unknown}"
    volumes:
      - ./deployment/secrets/app_secrets.toml:/app/secrets/app_secrets.toml:ro
    expose:
      - "8000"
    # O ambiente de homologação continua disponível, mas cede CPU à produção.
    cpu_shares: 128
    mem_limit: 240m
    pids_limit: 80
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  worker:
    image: formacao-do-investidor-production:current
    restart: unless-stopped
    command: ["/app/deployment/start-worker.sh"]
    environment:
      APP_ENVIRONMENT: production
      APP_SECRETS_FILE: /app/secrets/app_secrets.toml
      BACKGROUND_WORKER_POLL_SECONDS: "5"
      BACKGROUND_SCHEDULER_ENABLED: "true"
      BACKGROUND_SCHEDULER_TICK_SECONDS: "60"
      ALERT_MONITOR_ENABLED: "true"
      SERVICE_NODE_ID: primary-worker
      APP_COMMIT_SHA: "${FDI_RELEASE_COMMIT:-unknown}"
      SERVICE_HEARTBEAT_SECONDS: "30"
      RUNTIME_LEASE_SECONDS: "180"
      DATABASE_POOL_SIZE: "1"
      DATABASE_MAX_OVERFLOW: "0"
    volumes:
      - ./deployment/secrets/app_secrets.toml:/app/secrets/app_secrets.toml:ro
    networks:
      # A rede frontend fornece DNS e saída HTTPS para as fontes externas.
      # A backend permanece necessária para o PostgreSQL isolado.
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 260m
    cpu_shares: 256
    pids_limit: 100
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_worker_heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: formacaodoinvestidor.com.br
      ACME_EMAIL: contato@formacaodoinvestidor.com.br
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    cpu_shares: 768
    mem_limit: 80m
    pids_limit: 80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./deployment/Caddyfile.oracle-micro.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
