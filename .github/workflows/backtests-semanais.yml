name: Backtests oficiais semanais
run-name: Backtests oficiais • ${{ inputs.job_id || 'agendado' }}

on:
  schedule:
    # 00:01 de sábado em Brasília (03:01 UTC).
    - cron: "1 3 * * 6"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Até 100 tickers separados por vírgula; vazio usa as 50 ações do filtro Padrão"
        required: false
        default: ""
      max_combinations:
        description: "Combinações por ativo (máximo 200)"
        required: true
        default: "200"
      job_id:
        description: "Identificador do pedido registrado no painel"
        required: false
        default: ""
      environment:
        description: "Ambiente que receberá os resultados"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: backtests-oficiais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: backtests_ci
          POSTGRES_USER: backtests_ci
          POSTGRES_PASSWORD: temporary-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backtests_ci -d backtests_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável, acessível apenas durante esta execução no GitHub.
      DATABASE_URL: postgresql+psycopg://backtests_ci:temporary-ci-password@127.0.0.1:5432/backtests_ci
      # As execuções agendadas continuam entregando na produção. Uma
      # execução manual iniciada no ambiente de teste volta para /testefdi.
      BACKTEST_CALLBACK_URL: ${{ github.event_name == 'schedule' && 'https://formacaodoinvestidor.com.br' || (inputs.environment == 'staging' && 'https://formacaodoinvestidor.com.br/testefdi' || 'https://formacaodoinvestidor.com.br') }}
      BACKTEST_CALLBACK_TOKEN: ${{ secrets.BACKTEST_CALLBACK_TOKEN }}
      APP_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar entrega segura dos resultados
        shell: bash
        run: |
          if [ "${#BACKTEST_CALLBACK_TOKEN}" -lt 32 ]; then
            echo "::error title=Credencial de retorno ausente::Crie o Repository secret BACKTEST_CALLBACK_TOKEN em Settings > Secrets and variables > Actions e use exatamente o mesmo valor no servidor Oracle."
            exit 1
          fi
      - name: Calcular e entregar os resultados à Oracle
        env:
          MANUAL_TICKERS: ${{ inputs.tickers }}
          MANUAL_MAX_COMBINATIONS: ${{ inputs.max_combinations }}
          MANUAL_JOB_ID: ${{ inputs.job_id }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m scripts.run_weekly_backtests --source scheduled --max-combinations 200
          else
            args=(--source manual --max-combinations "$MANUAL_MAX_COMBINATIONS" --tickers "$MANUAL_TICKERS")
            if [ -n "$MANUAL_JOB_ID" ]; then
              args+=(--job-id "$MANUAL_JOB_ID")
            fi
            python -m scripts.run_weekly_backtests "${args[@]}"
          fi
