name: Testes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./github_actions.sqlite3
      APP_AUTH_REQUIRED: "false"
      ALERT_MONITOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar sintaxe
        run: python -m compileall -q app.py investment_engine scripts tests_v1160 tests_v1170
      - name: Executar testes
        run: python -m pytest -q tests_v1160 tests_v1170
