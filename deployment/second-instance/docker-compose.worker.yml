name: formacao-do-investidor-worker-node

services:
  worker:
    build:
      context: ../..
    image: formacao-do-investidor-worker-node:current
    restart: unless-stopped
    command: ["/app/deployment/start-worker.sh"]
    user: "10001:10001"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENVIRONMENT: production-worker
      APP_SECRETS_FILE: /app/secrets/worker_secrets.toml
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      SERVICE_NODE_ID: "${FDI_WORKER_NODE_ID:-worker-02}"
      APP_COMMIT_SHA: "${FDI_RELEASE_COMMIT:-unknown}"
      BACKGROUND_WORKER_POLL_SECONDS: "5"
      BACKGROUND_SCHEDULER_ENABLED: "${FDI_COORDINATOR_ENABLED:-false}"
      BACKGROUND_SCHEDULER_TICK_SECONDS: "60"
      ALERT_MONITOR_ENABLED: "${FDI_COORDINATOR_ENABLED:-false}"
      SERVICE_HEARTBEAT_SECONDS: "30"
      RUNTIME_LEASE_SECONDS: "180"
      CURRENT_METRICS_BACKFILL_BATCH_SIZE: "50"
      CURRENT_METRICS_BACKFILL_MAX_BATCH_SIZE: "100"
      CURRENT_METRICS_CONTINUATION_DELAY_SECONDS: "3"
      CURRENT_METRICS_CONTINUATION_PRIORITY: "180"
      DATABASE_POOL_SIZE: "4"
      DATABASE_MAX_OVERFLOW: "1"
      DATABASE_POOL_TIMEOUT_SECONDS: "20"
    volumes:
      - ./worker_secrets.toml:/app/secrets/worker_secrets.toml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=1777
    # OCI DNS remains first; Cloudflare is only a fallback for public providers.
    dns:
      - 169.254.169.254
      - 1.1.1.1
    mem_limit: "${FDI_WORKER_MEMORY_LIMIT:-512m}"
    pids_limit: 120
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_worker_heartbeat"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s

